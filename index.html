<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정기공연 '숨' (SSUM) 초대장</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Pinyon Script & Pretendard -->
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    @font-face {
      font-family: 'GmarketSansMedium';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #ffffff; /* 메인 화면 배경 순백색 */
      color: #414141;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    .font-pinyon {
      font-family: 'Pinyon Script', cursive;
    }
    .font-gmarket {
      font-family: 'GmarketSansMedium', sans-serif;
    }
    /* Floating Paper Animation */
    @keyframes floatPaper {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-0.5deg); }
    }
    .floating-paper {
      animation: floatPaper 4s ease-in-out infinite;
    }
    /* Slow Blinking Animation */
    @keyframes slowBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .blink-slow {
      animation: slowBlink 2.5s ease-in-out infinite;
    }
    /* Glitter Particle Animation */
    @keyframes glitterAnim {
      0% {
        transform: translate(0, 0) scale(0.4) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(180deg);
        opacity: 0;
      }
    }
    .glitter-particle {
      position: absolute;
      pointer-events: none;
      background: radial-gradient(circle, #ffffff 0%, #ffeef2 60%, rgba(255,255,255,0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff, 0 0 18px #e59fb1;
      animation: glitterAnim 0.7s forwards ease-out;
      z-index: 9999;
    }
    /* Toast Notification */
    #toast {
      visibility: hidden;
      min-width: 280px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 12px;
      padding: 14px 20px;
      position: fixed;
      z-index: 10000;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: opacity 0.3s, visibility 0.3s;
    }
    #toast.show {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen">

  <!-- Toast Message Box -->
  <div id="toast">주소가 복사되었습니다! 필요한 곳에 붙여넣기 하세요!</div>

  <!-- INTRO OVERLAY SCREEN -->
  <div id="intro-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#f7f9fb]/95 backdrop-blur-md transition-opacity duration-700 p-4 cursor-pointer" onclick="openInvitation(event)">
    
    <!-- Landscape Letter Paper Card -->
    <div class="relative w-full max-w-[460px] aspect-[1.4/1] bg-white rounded-3xl p-8 flex flex-col items-center justify-center text-center shadow-[0_20px_50px_rgba(65,65,65,0.1)] border border-gray-100 floating-paper transition-transform active:scale-95">
      
      <!-- Top Right Small Paper Clip (#e59fb1) -->
      <div class="absolute -top-3 right-10 w-6 h-12 bg-[#e59fb1] rounded-full shadow-md border-2 border-white flex items-center justify-center transform rotate-12">
        <div class="w-2.5 h-7 bg-white/40 rounded-full"></div>
      </div>

      <!-- Ssum Title (Pinyon Script, 130px, #414141) -->
      <h1 class="font-pinyon text-[110px] sm:text-[130px] leading-none text-[#414141] mb-1 select-none">Ssum</h1>

      <!-- Subtitle: 정기공연 '숨' (Gmarket Sans, 22px, #414141) -->
      <h2 class="font-gmarket text-[20px] sm:text-[22px] text-[#414141] font-bold tracking-tight mb-6 select-none">
        정기공연 '숨'
      </h2>

      <!-- Footer Touch Instruction (Gmarket Sans, 13px, #e59fb1, Slow Blink) -->
      <p class="font-gmarket text-[13px] text-[#e59fb1] tracking-wider blink-slow select-none">
        초대장을 터치하세요!
      </p>

    </div>
  </div>

  <!-- MAIN APP CONTAINER (Unified Background, No separate box wrapping everything) -->
  <div class="w-full max-w-[480px] min-h-screen flex flex-col px-5 py-8 pb-16 bg-white">

    <!-- Poster Banner Area ("정기공연10 (4).jpg") -->
    <div class="w-full mb-6 rounded-2xl overflow-hidden shadow-[0_10px_30px_rgba(65,65,65,0.06)] bg-white">
      <img src="정기공연10 (4).jpg" alt="정기공연 '숨' 포스터" class="w-full h-auto object-cover block" onerror="this.src='정기공연10 (4).png'; this.onerror=function(){this.src='https://placehold.co/600x850/ffffff/414141?text=SSUM+Concert+Poster';}">
    </div>

    <!-- Performance Info Card -->
    <div class="w-full bg-white border border-[#747474] rounded-2xl p-6 mb-6 shadow-sm">
      <h3 class="font-gmarket text-[18px] text-[#414141] font-bold mb-4 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[#e59fb1]"></span> 공연 정보
      </h3>
      <div class="space-y-2.5 text-[15px] text-[#414141] font-medium leading-relaxed">
        <p><b class="font-semibold text-[#414141]">일시:</b> 2026년 11월 27일 (금) 저녁 7:00</p>
        <p><b class="font-semibold text-[#414141]">주최:</b> 숭실대학교 글로벌미래교육원 실용음악학 전공</p>
        <p><b class="font-semibold text-[#414141]">장소:</b> 숭실대학교 학생회관 1층 블루큐브</p>
        <p><b class="font-semibold text-[#414141]">주소:</b> 서울시 동작구 상도로 369</p>
      </div>
    </div>

    <!-- Directions Button Group -->
    <div class="flex flex-col gap-3 mb-6">
      <!-- Kakao Map Button -->
      <a href="https://map.kakao.com/link/to/숭실대학교학생회관,37.4963,126.9573" target="_blank" onclick="playDdoingSound()" class="w-full py-4 px-6 bg-[#fee500] hover:bg-[#fdd800] text-[#191919] font-gmarket text-[15px] font-bold rounded-2xl shadow-sm text-center transition-all transform active:scale-98 flex items-center justify-center">
        카카오맵 길찾기
      </a>
      
      <!-- Naver Map Button -->
      <a href="https://map.naver.com/v5/search/숭실대학교학생회관" target="_blank" onclick="playDdoingSound()" class="w-full py-4 px-6 bg-[#03c75a] hover:bg-[#02b350] text-white font-gmarket text-[15px] font-bold rounded-2xl shadow-sm text-center transition-all transform active:scale-98 flex items-center justify-center">
        네이버 지도 길찾기
      </a>
    </div>

    <!-- Share Section ("친구에게 공유하기!") -->
    <div class="w-full bg-white border border-[#747474] rounded-2xl p-6 shadow-sm mb-4">
      <h4 class="font-gmarket text-[16px] text-[#414141] font-bold mb-4 text-center">
        친구에게 공유하기!
      </h4>

      <!-- Share Action Buttons (Kakao, Insta, Copy) - No Emojis, Native Colors -->
      <div class="grid grid-cols-3 gap-2.5">
        <!-- KakaoTalk Share Button -->
        <button onclick="shareKakao(event)" class="py-3 px-2 bg-[#fee500] hover:bg-[#fdd800] text-[#191919] font-gmarket text-[13px] font-bold rounded-xl shadow-sm transition-all transform active:scale-95 flex items-center justify-center">
          카카오톡
        </button>

        <!-- Instagram Share Button -->
        <button onclick="shareInstagram(event)" class="py-3 px-2 bg-[#e1306c] hover:bg-[#c1225b] text-white font-gmarket text-[13px] font-bold rounded-xl shadow-sm transition-all transform active:scale-95 flex items-center justify-center">
          인스타그램
        </button>

        <!-- Copy Address Button -->
        <button onclick="copyAddress(event)" class="py-3 px-2 bg-white border border-[#747474] text-[#414141] hover:bg-gray-50 font-gmarket text-[12px] font-bold rounded-xl shadow-sm transition-all transform active:scale-95 flex items-center justify-center">
          주소 복사하기
        </button>
      </div>
    </div>

    <!-- Footer Credit -->
    <div class="mt-auto pt-6 text-center text-xs text-[#747474]">
      <p>© 2026 숭실대학교 글로벌미래교육원 실용음악전공</p>
    </div>

  </div>

  <!-- JavaScript Audio & Interaction Logic -->
  <script>
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Paper Turning / Rustling Sound
    function playPaperSound() {
      try {
        const ctx = getAudioContext();
        const bufferSize = ctx.sampleRate * 0.5; // 500ms
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.2));
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.5);
        filter.Q.value = 4;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.7, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
      } catch(e) {
        console.log("Audio error:", e);
      }
    }

    // Cute Ddoing Pitch Bend Sound
    function playDdoingSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        const startTime = ctx.currentTime;
        
        osc.frequency.setValueAtTime(520, startTime);
        osc.frequency.exponentialRampToValueAtTime(880, startTime + 0.2);

        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + 0.25);
      } catch(e) {
        console.log("Audio error:", e);
      }
    }

    // Glitter Particle Effect on Click + Ddoing sound
    document.addEventListener('click', function(e) {
      playDdoingSound();

      const count = 12;
      for (let i = 0; i < count; i++) {
        const glitter = document.createElement('div');
        glitter.className = 'glitter-particle';
        
        const size = Math.random() * 8 + 6;
        glitter.style.width = `${size}px`;
        glitter.style.height = `${size}px`;
        
        glitter.style.left = `${e.pageX}px`;
        glitter.style.top = `${e.pageY}px`;

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 70 + 20;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;

        glitter.style.setProperty('--tx', `${tx}px`);
        glitter.style.setProperty('--ty', `${ty}px`);

        document.body.appendChild(glitter);
        setTimeout(() => glitter.remove(), 700);
      }
    });

    // Open Invitation Handler
    function openInvitation(event) {
      event.stopPropagation();
      playPaperSound();
      playDdoingSound();

      const intro = document.getElementById('intro-screen');
      intro.style.opacity = '0';
      setTimeout(() => {
        intro.style.display = 'none';
      }, 700);
    }

    // Copy Address Handler
    function copyAddress(event) {
      event.stopPropagation();
      playDdoingSound();
      
      const address = "서울시 동작구 상도로 369 숭실대학교 학생회관 1층 블루큐브";
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(address).then(() => {
          showToast();
        }).catch(() => {
          fallbackCopyText(address);
        });
      } else {
        fallbackCopyText(address);
      }
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
        showToast();
      } catch (err) {
        console.error('Fallback copy failed', err);
      }
      document.body.removeChild(textarea);
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.className = "show";
      setTimeout(() => {
        toast.className = toast.className.replace("show", "");
      }, 3000);
    }

    // Kakao Share Handler
    function shareKakao(event) {
      event.stopPropagation();
      playDdoingSound();
      const shareUrl = window.location.href;
      const shareText = "당신을 초대합니다! 숭실대학교 글로벌미래교육원 실용음악전공 정기공연 '숨'";

      if (navigator.share) {
        navigator.share({
          title: "정기공연 '숨'",
          text: shareText,
          url: shareUrl,
        }).catch(() => {});
      } else {
        const kakaoIntentUrl = `https://sharer.kakao.com/talk/friends/picker/link?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`;
        window.open(kakaoIntentUrl, '_blank');
      }
    }

    // Instagram Share Handler
    function shareInstagram(event) {
      event.stopPropagation();
      playDdoingSound();
      
      const inviteMsg = "당신을 초대합니다! 숭실대학교 글로벌미래교육원 실용음악전공 정기공연 '숨' 초대장 링크: " + window.location.href;
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(inviteMsg).then(() => {
          const toast = document.getElementById("toast");
          toast.innerText = "초대장 문구가 복사되었습니다! 인스타그램 DM에 붙여넣기 하세요.";
          toast.className = "show";
          setTimeout(() => {
            toast.className = toast.className.replace("show", "");
            toast.innerText = "주소가 복사되었습니다! 필요한 곳에 붙여넣기 하세요!";
          }, 3500);
        });
      }

      setTimeout(() => {
        window.location.href = "instagram://app";
        setTimeout(() => {
          window.open("https://www.instagram.com", "_blank");
        }, 1000);
      }, 500);
    }
  </script>

</body>
</html>
