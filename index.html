<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정기공연 '숨' (SSUM)</title>
  <!-- 눈누 웹폰트(프리텐다드) 적용 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #ffffff; /* 포스터 배경과 맞춘 깔끔한 화이트톤 */
      color: #111111;
      font-family: 'Pretendard', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 480px; /* 모바일 화면에 예쁘게 보이도록 고정 폭 설정 */
      text-align: center;
    }
    /* 포스터 이미지 스타일 */
    .poster-img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08); /* 부드러운 그림자 효과 */
      margin-bottom: 24px;
    }
    /* 공연 정보 카드 박스 */
    .info-card {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      margin-bottom: 20px;
    }
    .info-card h3 {
      font-size: 18px;
      color: #333333;
      margin-bottom: 12px;
    }
    .info-card p {
      font-size: 15px;
      line-height: 1.6;
      color: #495057;
      margin-bottom: 8px;
    }
    /* 버튼 스타일 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      transition: 0.2s;
    }
    .btn-kakao {
      background-color: #fee500;
      color: #191919;
    }
    .btn-naver {
      background-color: #03c75a;
      color: #ffffff;
    }
    .btn-copy {
      background-color: #e9ecef;
      color: #333333;
      border: none;
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 포스터 이미지 (포스터 파일명을 정기공연8.jpg로 저장해서 같은 폴더에 넣어주세요!) -->
    <img src="정기공연8.jpg" alt="정기공연 '숨' 포스터" class="poster-img">

    <!-- 2. 공연 안내 정보 (포스터에 적힌 내용 그대로 세팅해 둠) -->
    <div class="info-card">
      <h3>📅 공연 정보</h3>
      <p><b>일시:</b> 2026년 11월 27일 (금) 저녁 7:00</p>
      <p><b>장소:</b> 숭실대학교 학생회관 1층 블루큐브</p>
      <p><b>주소:</b> 서울시 동작구 상도로 369 숭실대학교</p>
    </div>

    <!-- 3. 지도 및 주소 복사 버튼 -->
    <div class="btn-group">
      <!-- 카카오맵 길찾기 -->
      <a href="https://map.kakao.com/link/to/숭실대학교학생회관,37.4963,126.9573" target="_blank" class="btn btn-kakao">
        카카오맵 길찾기
      </a>
      
      <!-- 네이버지도 길찾기 -->
      <a href="https://map.naver.com/v5/search/숭실대학교학생회관" target="_blank" class="btn btn-naver">
        네이버 지도 길찾기
      </a>

      <!-- 주소 복사 버튼 -->
      <button class="btn btn-copy" onclick="copyAddress()">주소 클립보드에 복사하기</button>
    </div>
  </div>

  <script>
    function copyAddress() {
      const address = "서울시 동작구 상도로 369 숭실대학교 학생회관 1층 블루큐브";
      navigator.clipboard.writeText(address).then(() => {
        alert("주소가 복사되었습니다! 필요한 곳에 붙여넣기 하세요.");
      });
    }
  </script>

</body>
</html>
﻿
