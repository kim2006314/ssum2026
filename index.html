<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정기공연 '숨' (SSUM) 초대장</title>
  <!-- 구글 폰트 (Pinyon Script) 및 눈누 폰트 안전 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'GmarketSansMedium';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #414141;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* 토스트 알림창 */
    #toast {
      visibility: hidden;
      min-width: 280px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 12px;
      padding: 14px 20px;
      position: fixed;
      z-index: 10000;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: opacity 0.3s, visibility 0.3s;
      opacity: 0;
    }
    #toast.show {
      visibility: visible;
      opacity: 1;
    }

    /* 1. 인트로 화면 (가로 편지지) */
    #intro-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(247, 249, 251, 0.96);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 0.6s ease;
      cursor: pointer;
      padding: 20px;
    }

    .envelope-box {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1.4 / 1;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(65, 65, 65, 0.12);
      border: 1px solid #f0f0f0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      animation: floatPaper 3.5s ease-in-out infinite;
    }

    @keyframes floatPaper {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .paper-clip {
      position: absolute;
      top: -10px;
      right: 36px;
      width: 22px;
      height: 44px;
      background-color: #e59fb1;
      border-radius: 9999px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
      border: 2px solid #ffffff;
      transform: rotate(12deg);
    }

    .intro-ssum {
      font-family: 'Pinyon Script', cursive;
      font-size: 110px;
      color: #414141;
      line-height: 1;
      margin-bottom: 2px;
    }

    .intro-title {
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 20px;
      color: #414141;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .intro-touch {
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 13px;
      color: #e59fb1;
      animation: slowBlink 2s ease-in-out infinite;
    }

    @keyframes slowBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* 2. 메인 컨테이너 */
    .main-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 20px 40px 20px;
      background-color: #ffffff;
    }

    /* 포스터 이미지 */
    .poster-box {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(65, 65, 65, 0.08);
      margin-bottom: 20px;
      background-color: #ffffff;
    }
    .poster-box img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* 공연 정보 카드 (단어 단위 줄바꿈 유지) */
    .info-card {
      width: 100%;
      background-color: #ffffff;
      border: 1px solid #747474;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .info-card h3 {
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 17px;
      color: #414141;
      font-weight: bold;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #e59fb1;
      display: inline-block;
    }
    .info-content p {
      font-size: 14px;
      color: #414141;
      font-weight: 500;
      line-height: 1.6;
      margin-bottom: 8px;
      word-break: keep-all;
    }
    .info-content p:last-child { margin-bottom: 0; }

    /* 버튼 그룹 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
      display: block;
    }
    .btn:active { transform: scale(0.98); }
    .btn-kakao { background-color: #fee500; color: #191919; }
    .btn-naver { background-color: #03c75a; color: #ffffff; }

    /* 친구에게 공유하기 */
    .share-section {
      width: 100%;
      background-color: #ffffff;
      border: 1px solid #747474;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .share-title {
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 16px;
      color: #414141;
      font-weight: bold;
      text-align: center;
      margin-bottom: 14px;
    }
    .share-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .btn-share {
      padding: 12px 4px;
      border-radius: 12px;
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      border: none;
    }
    .btn-share:active { transform: scale(0.95); }
    .btn-share-kakao { background-color: #fee500; color: #191919; }
    .btn-share-insta { background-color: #e1306c; color: #ffffff; }
    .btn-share-copy {
      background-color: #ffffff;
      border: 1px solid #747474;
      color: #414141;
    }

    .footer {
      margin-top: auto;
      padding-top: 16px;
      text-align: center;
      font-size: 12px;
      color: #747474;
    }

    /* 글리터 입자 */
    .glitter-particle {
      position: absolute;
      pointer-events: none;
      background: radial-gradient(circle, #ffffff 0%, #ffeef2 60%, rgba(255,255,255,0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff, 0 0 14px #e59fb1;
      animation: glitterAnim 0.6s forwards ease-out;
      z-index: 9999;
    }
    @keyframes glitterAnim {
      0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="toast">주소가 복사되었습니다! 필요한 곳에 붙여넣기 하세요!</div>

  <!-- 1. 오프닝 카드 -->
  <div id="intro-screen" onclick="openInvitation(event)">
    <div class="envelope-box">
      <div class="paper-clip"></div>
      <h1 class="intro-ssum">Ssum</h1>
      <h2 class="intro-title">정기공연 '숨'</h2>
      <p class="intro-touch">초대장을 터치하세요!</p>
    </div>
  </div>

  <!-- 2. 메인 컨테이너 -->
  <div class="main-container">
    
    <!-- 포스터 (정기공연10 (4).jpg) -->
    <div class="poster-box">
      <img src="정기공연10 (4).jpg" alt="정기공연 '숨' 포스터" onerror="this.src='정기공연10 (4).png'; this.onerror=function(){this.style.display='none';}">
    </div>

    <!-- 공연 정보 -->
    <div class="info-card">
      <h3><span class="info-dot"></span> 공연 정보</h3>
      <div class="info-content">
        <p><b>일시:</b> 2026년 11월 27일 (금) 저녁 7:00</p>
        <p><b>주최:</b> 숭실대학교 글로벌미래교육원 실용음악학 전공</p>
        <p><b>장소:</b> 숭실대학교 학생회관 1층 블루큐브</p>
        <p><b>주소:</b> 서울시 동작구 상도로 369</p>
      </div>
    </div>

    <!-- 길찾기 -->
    <div class="btn-group">
      <a href="https://map.kakao.com/link/to/숭실대학교학생회관,37.4963,126.9573" target="_blank" onclick="playDdoingSound()" class="btn btn-kakao">
        카카오맵 길찾기
      </a>
      <a href="https://map.naver.com/v5/search/숭실대학교학생회관" target="_blank" onclick="playDdoingSound()" class="btn btn-naver">
        네이버 지도 길찾기
      </a>
    </div>

    <!-- 공유하기 -->
    <div class="share-section">
      <h4 class="share-title">친구에게 공유하기!</h4>
      <div class="share-grid">
        <button onclick="shareKakao(event)" class="btn-share btn-share-kakao">카카오톡</button>
        <button onclick="shareInstagram(event)" class="btn-share btn-share-insta">인스타그램</button>
        <button onclick="copyAddress(event)" class="btn-share btn-share-copy">주소 복사하기</button>
      </div>
    </div>

    <div class="footer">
      <p>© 2026 숭실대학교 글로벌미래교육원 실용음악학 전공</p>
    </div>

  </div>

  <script>
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playPaperSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const bufferSize = ctx.sampleRate * 0.4;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.15));
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1000, ctx.currentTime);
        filter.Q.value = 3;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
      } catch(e) {}
    }

    function playDdoingSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        const startTime = ctx.currentTime;
        osc.frequency.setValueAtTime(500, startTime);
        osc.frequency.exponentialRampToValueAtTime(850, startTime + 0.18);
        gain.gain.setValueAtTime(0.25, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.2);
      } catch(e) {}
    }

    document.addEventListener('click', function(e) {
      playDdoingSound();
      for (let i = 0; i < 8; i++) {
        const glitter = document.createElement('div');
        glitter.className = 'glitter-particle';
        const size = Math.random() * 6 + 6;
        glitter.style.width = size + 'px';
        glitter.style.height = size + 'px';
        glitter.style.left = e.pageX + 'px';
        glitter.style.top = e.pageY + 'px';
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 50 + 15;
        glitter.style.setProperty('--tx', (Math.cos(angle) * distance) + 'px');
        glitter.style.setProperty('--ty', (Math.sin(angle) * distance) + 'px');
        document.body.appendChild(glitter);
        setTimeout(function() { glitter.remove(); }, 600);
      }
    });

    function openInvitation(event) {
      event.stopPropagation();
      playPaperSound();
      playDdoingSound();
      const intro = document.getElementById('intro-screen');
      intro.style.opacity = '0';
      setTimeout(function() {
        intro.style.display = 'none';
      }, 600);
    }

    function copyAddress(event) {
      event.stopPropagation();
      playDdoingSound();
      const address = "서울시 동작구 상도로 369 숭실대학교 학생회관 1층 블루큐브";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(address).then(showToast).catch(function() { fallbackCopy(address); });
      } else {
        fallbackCopy(address);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(); } catch (e) {}
      document.body.removeChild(ta);
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.className = "show";
      setTimeout(function() { toast.className = ""; }, 3000);
    }

    function shareKakao(event) {
      event.stopPropagation();
      playDdoingSound();
      const url = window.location.href;
      const text = "당신을 초대합니다! 숭실대학교 글로벌미래교육원 실용음악학 전공 정기공연 '숨'";
      if (navigator.share) {
        navigator.share({ title: "정기공연 '숨'", text: text, url: url }).catch(function(){});
      } else {
        window.open("https://sharer.kakao.com/talk/friends/picker/link?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(text), '_blank');
      }
    }

    function shareInstagram(event) {
      event.stopPropagation();
      playDdoingSound();
      const msg = "당신을 초대합니다! 숭실대학교 글로벌미래교육원 실용음악학 전공 정기공연 '숨' 초대장: " + window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg).then(function() {
          const toast = document.getElementById("toast");
          toast.innerText = "초대장 문구가 복사되었습니다! 인스타그램 DM에 붙여넣기 하세요.";
          toast.className = "show";
          setTimeout(function() {
            toast.className = "";
            toast.innerText = "주소가 복사되었습니다! 필요한 곳에 붙여넣기 하세요!";
          }, 3500);
        });
      }
    }
  </script>
</body>
</html>
